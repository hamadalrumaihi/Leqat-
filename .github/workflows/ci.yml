name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders; NEXT_PUBLIC_* are inlined at build,
      # real values come from the deploy platform.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  db:
    name: Migration chain (supabase db reset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Boots the local stack and applies 0001–00xx + seed from scratch —
      # catches broken SQL, ordering problems, and edits to applied files.
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - run: supabase db reset
      - name: Sanity probes
        run: |
          DB=$(docker ps --format '{{.Names}}' | grep supabase_db)
          # realtime publication must carry the three live tables (0012)
          docker exec "$DB" psql -U postgres -d postgres -tAc \
            "select count(*) from pg_publication_tables where pubname='supabase_realtime' and tablename in ('chat_messages','pickup_status','attendance')" | grep -qx 3
          # API roles must be able to read (0009 grants)
          docker exec "$DB" psql -U postgres -d postgres -tAc \
            "select has_table_privilege('authenticated','public.profiles','select')" | grep -qx t
